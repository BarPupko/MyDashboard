<!doctype html>
<html>

<head>
    <meta charset="utf-8" />
    <script>
        // SPA fallback for GitHub Pages.
        // When GitHub Pages serves a 404 for a deep link, this script
        // saves the intended URL in sessionStorage and redirects to the root.
        sessionStorage.redirect = location.href;
        location.replace(location.origin + '/MyDashboard/');
    </script>
</head>

<body></body>

</html>
